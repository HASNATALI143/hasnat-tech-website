
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hasnat Tech | Task Manager 3.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#0f172a,#155e75);
 color:white;min-height:100vh;
}
.app{
 max-width:800px;margin:20px auto;
 background:#1e293b;padding:25px;
 border-radius:20px;
 box-shadow:0 10px 30px #0005;
}
h1{text-align:center;color:#22d3ee}
.subtitle{text-align:center;color:#cbd5e1}
h2{margin-top:30px}
.dashboard{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;margin-top:25px;
}
.stat{
 background:#334155;
 padding:18px 8px;
 border-radius:12px;text-align:center;
}
.stat strong{
 display:block;font-size:28px;color:#22d3ee;
}
.stat span{font-size:12px;color:#cbd5e1}
.progress{
 background:#475569;
 height:12px;border-radius:20px;
 overflow:hidden;margin-top:20px;
}
#bar{
 background:#2dd4bf;
 width:0%;height:100%;
 transition:width .3s;
}
#progressText{text-align:center;color:#cbd5e1}
form{
 display:grid;
 grid-template-columns:1fr 150px;
 gap:10px;
}
input,select{
 padding:12px;border:0;
 border-radius:8px;font-size:15px;
 width:100%;min-width:0;
}
button,.file-label{
 padding:12px;border:0;
 border-radius:8px;cursor:pointer;
 font-weight:bold;
 font-size:13px;
}
.add{background:#22d3ee;color:#083344}
.done-btn{background:#0d9488;color:white}
.edit-btn{background:#eab308;color:#1c1917}
.delete-btn{background:#dc2626;color:white}
.backup-btn{background:#2563eb;color:white}
.restore-btn{background:#475569;color:white}
.tools{
 display:flex;gap:10px;
 flex-wrap:wrap;margin:20px 0;
}
.tools button{background:#475569;color:white}
.tools button.active{background:#0891b2}
.backup{
 display:flex;gap:10px;
 flex-wrap:wrap;margin-top:15px;
}
#restoreFile{display:none}
ul{list-style:none;padding:0}
li{
 background:#334155;
 padding:14px;margin-bottom:12px;
 border-radius:12px;
 display:flex;gap:10px;
 align-items:center;flex-wrap:wrap;
}
.task-info{
 flex:1;min-width:140px;
 overflow-wrap:anywhere;
}
.task-info strong{display:block;margin-bottom:6px}
.task-info small{color:#cbd5e1}
.completed{
 text-decoration:line-through;color:#94a3b8;
}
.priority{
 display:inline-block;
 padding:4px 8px;border-radius:6px;
 margin:5px 0;font-size:12px;
}
.high{background:#7f1d1d;color:#fecaca}
.medium{background:#78350f;color:#fde68a}
.low{background:#064e3b;color:#a7f3d0}
.empty{text-align:center;color:#cbd5e1}
footer{
 text-align:center;color:#94a3b8;
 margin-top:35px;font-size:13px;
}
@media(max-width:600px){
 .app{padding:18px}
 form{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">

<h1>🚀 Hasnat Tech</h1>
<p class="subtitle">Smart Task Manager 3.0</p>

<div class="dashboard">
 <div class="stat">
  <strong id="total">0</strong>
  <span>Total Tasks</span>
 </div>
 <div class="stat">
  <strong id="completed">0</strong>
  <span>Completed</span>
 </div>
 <div class="stat">
  <strong id="pending">0</strong>
  <span>Pending</span>
 </div>
</div>

<div class="progress"><div id="bar"></div></div>
<p id="progressText">0% completed</p>

<h2>➕ Add Task</h2>

<form id="taskForm">
 <input id="taskInput" placeholder="Enter task"
        maxlength="150" required>

 <select id="priority">
  <option value="medium">Medium Priority</option>
  <option value="high">High Priority</option>
  <option value="low">Low Priority</option>
 </select>

 <input type="date" id="dueDate">

 <button class="add" type="submit">
  + Add Task
 </button>
</form>

<h2>📋 My Tasks</h2>

<input id="search" type="search"
       placeholder="Search tasks...">

<div class="tools">
 <button data-filter="all" class="active">All</button>
 <button data-filter="pending">Pending</button>
 <button data-filter="completed">Completed</button>
</div>

<ul id="taskList"></ul>

<h2>💾 Data Backup</h2>
<p>Download your tasks or restore a saved backup.</p>

<div class="backup">
 <button class="backup-btn" id="downloadBtn">
  ⬇ Download Backup
 </button>

 <label class="file-label restore-btn"
        for="restoreFile">
  ⬆ Restore Backup
 </label>

 <input id="restoreFile" type="file"
        accept=".json,application/json">
</div>

<footer>
 © 2026 Hasnat Tech
 <p>Built with HTML, CSS & JavaScript</p>
 <p>Data is saved in your browser.</p>
</footer>

</div>

<script>
const KEY = "hasnatTasks";

const taskInput = document.getElementById("taskInput");
const taskList = document.getElementById("taskList");
const search = document.getElementById("search");

let tasks = [];
let filter = "all";

// Make old 2.0 tasks compatible with 3.0
function cleanTask(t) {
 if(!t || typeof t !== "object" ||
    typeof t.text !== "string") return null;

 let text = t.text.trim().slice(0,150);
 if(!text) return null;

 return {
  text:text,
  done:t.done === true,
  priority:["high","medium","low"].includes(t.priority)
   ? t.priority : "medium",
  dueDate:typeof t.dueDate === "string" &&
   /^\d{4}-\d{2}-\d{2}$/.test(t.dueDate)
   ? t.dueDate : ""
 };
}

// Load tasks
try {
 let data = JSON.parse(localStorage.getItem(KEY));
 if(Array.isArray(data)) {
  tasks = data.map(cleanTask).filter(Boolean);
 }
} catch(e) {
 tasks = [];
}

// Save tasks
function save() {
 try {
  localStorage.setItem(KEY,JSON.stringify(tasks));
  return true;
 } catch(e) {
  alert("Unable to save tasks.");
  return false;
 }
}

// Update dashboard
function dashboard() {
 let total = tasks.length;
 let done = tasks.filter(t=>t.done).length;
 let percent = total
   ? Math.round(done/total*100) : 0;

 document.getElementById("total").textContent=total;
 document.getElementById("completed").textContent=done;
 document.getElementById("pending").textContent=total-done;
 document.getElementById("bar").style.width=percent+"%";
 document.getElementById("progressText").textContent=
   percent+"% completed";
}

// Create button
function makeButton(text,css,action) {
 let b=document.createElement("button");
 b.textContent=text;
 b.className=css;
 b.type="button";
 b.onclick=action;
 return b;
}

// Show tasks
function showTasks() {
 taskList.replaceChildren();

 let count=0;
 let query=search.value.trim().toLowerCase();

 tasks.forEach((task,index)=>{
  if(filter==="pending" && task.done) return;
  if(filter==="completed" && !task.done) return;
  if(!task.text.toLowerCase().includes(query)) return;

  count++;
  let li=document.createElement("li");

  let info=document.createElement("div");
  info.className="task-info";

  let title=document.createElement("strong");
  title.textContent=task.text;
  if(task.done) title.className="completed";

  let priority=document.createElement("span");
  priority.className="priority "+task.priority;
  priority.textContent=task.priority.toUpperCase();

  let date=document.createElement("small");
  date.textContent=task.dueDate
    ? "Due: "+task.dueDate : "No deadline";

  info.append(title,priority,date);

  li.append(
   makeButton(task.done?"↩":"✓","done-btn",
      ()=>toggleTask(index)),
   info,
   makeButton("✏ Edit","edit-btn",
      ()=>editTask(index)),
   makeButton("X","delete-btn",
      ()=>deleteTask(index))
  );

  taskList.appendChild(li);
 });

 if(count===0) {
  let p=document.createElement("p");
  p.className="empty";
  p.textContent="No tasks found.";
  taskList.appendChild(p);
 }

 dashboard();
}

// Add task
document.getElementById("taskForm")
.addEventListener("submit",function(e) {
 e.preventDefault();

 let text=taskInput.value.trim();
 if(!text)return;

 tasks.push({
  text:text,
  done:false,
  priority:document.getElementById("priority").value,
  dueDate:document.getElementById("dueDate").value
 });

 save();
 showTasks();
 this.reset();
 taskInput.focus();
});

// Complete task
function toggleTask(index) {
 tasks[index].done=!tasks[index].done;
 save();
 showTasks();
}

// NEW: Edit task
function editTask(index) {
 let old=tasks[index].text;
 let changed=prompt("Edit your task:",old);

 if(changed===null)return;

 changed=changed.trim().slice(0,150);

 if(!changed) {
  alert("Task name cannot be empty.");
  return;
 }

 tasks[index].text=changed;
 save();
 showTasks();
}

// Delete task
function deleteTask(index) {
 tasks.splice(index,1);
 save();
 showTasks();
}

// Search
search.addEventListener("input",showTasks);

// Filters
document.querySelectorAll("[data-filter]")
.forEach(button=>{
 button.addEventListener("click",()=>{
  filter=button.dataset.filter;

  document.querySelectorAll("[data-filter]")
  .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");
  showTasks();
 });
});

// NEW: Download backup
document.getElementById("downloadBtn")
.addEventListener("click",()=>{

 let blob=new Blob(
  [JSON.stringify(tasks,null,2)],
  {type:"application/json"}
 );

 let url=URL.createObjectURL(blob);

 let a=document.createElement("a");
 a.href=url;
 a.download="hasnat-tech-backup.json";
 document.body.appendChild(a);
 a.click();
 a.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
});

// NEW: Restore backup
document.getElementById("restoreFile")
.addEventListener("change",async function() {
 let file=this.files[0];
 if(!file)return;

 try {
  if(file.size>1000000) {
   throw new Error("File is too large.");
  }

  let data=JSON.parse(await file.text());

  if(!Array.isArray(data) ||
     !data.every(t=>cleanTask(t)!==null)) {
   throw new Error("Invalid backup format.");
  }

  let restored=data.map(cleanTask);

  let ok=confirm(
   "Replace your current tasks with backup tasks?"
  );

  if(ok) {
   let previous=tasks;
   tasks=restored;

   if(!save()) {
    tasks=previous;
   }

   showTasks();
  }
 } catch(e) {
  alert("Could not restore backup: "+e.message);
 }

 this.value="";
});

// Start
showTasks();
</script>
</body>
</html>
